l_english:
 ca_court_automation:0 "Court Automation"
 ca_automation_title:0 "Court Automation"
 ca_automation_intro:0 "Choose one policy for all court positions. It applies when a position becomes vacant."
 ca_automation_result_help:0 "The list shows the actual setting for each position. A check marks settings that match your choice."
 ca_automation_mode_none:0 "No automation"
 ca_automation_mode_none_tt:0 "Leave vacancies for you to fill manually."
 ca_automation_mode_event:0 "Suggest candidates"
 ca_automation_mode_event_tt:0 "Show an event suggesting candidates when a position becomes vacant."
 ca_automation_mode_best:0 "Appoint the best"
 ca_automation_mode_best_tt:0 "Automatically appoint the eligible candidate with the highest aptitude."
 ca_automation_mode_best_event:0 "Appoint or notify"
 ca_automation_mode_best_event_tt:0 "Appoint the best eligible candidate, or show an event if none is available."
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "Close"
 decision_group_type_ca_court_automation:0 "Court Automation"
 ca_automation_decision:0 "Court Automation"
 ca_automation_decision_desc:0 "Set one vacancy-handling policy for court positions. Choose whether to leave posts empty, suggest candidates, appoint the best candidate, or appoint and notify when no candidate is available."
 ca_automation_decision_tooltip:0 "Choose an automation policy for all court positions"
 ca_automation_decision_confirm:0 "Open automation settings"
 ca_automation_decision_effect:0 "Opens the court automation picker. This changes how future vacancies are handled. Use #V Court Init#! to fill current vacancies."
 ca_court_init_decision:0 "Court Init"
 ca_court_init_decision_desc:0 "Put the court in order. Each available vacancy is offered to its most suitable eligible candidate. Where no candidate is available, a new courtier is created with random skills and the qualifications required for that position.\n\nExisting appointees keep their posts. New appointees receive their normal salaries.\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "Fill available court positions, creating suitable courtiers where needed"
 ca_court_init_decision_confirm:0 "Fill the court"
 ca_court_init_vacancy_required:0 "At least one supported court position has a vacancy"
 ca_court_init_decision_effect:0 "Fills available court positions with the best eligible candidates. Creates random, qualified courtiers where needed. Does not replace existing holders or councillors. Normal salaries apply."
 ca_court_init_result_title:0 "Court appointments completed"
 ca_court_init_result_desc:0 "Positions filled: [ROOT.Char.MakeScope.Var('ca_court_init_filled').GetValue|0]\nNew courtiers: [ROOT.Char.MakeScope.Var('ca_court_init_generated').GetValue|0]\nPositions left unfilled: [ROOT.Char.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "Bare Knights"
 ca_bare_knights_decision_desc:0 "Fill the empty places in your knight roster with newcomers. Their skills and personalities are random: some may be capable fighters, others decidedly unimpressive. They meet your realm's requirements, but greatness is not included.\n\nCreates only the number needed to reach your current knight limit."
 ca_bare_knights_decision_tooltip:0 "Create random eligible knights to fill the roster"
 ca_bare_knights_decision_confirm:0 "Bring in the newcomers"
 ca_bare_knights_vacancy_required:0 "There are fewer knights than the roster limit"
 ca_bare_knights_decision_effect:0 "Creates one new courtier per missing knight and forces their selection as a knight. Skills are random; only mandatory eligibility requirements are guaranteed. No recruitment fee."
 ca_bare_knights_result_title:0 "New knights at court"
 ca_bare_knights_result_desc:0 "Knights added: [ROOT.Char.MakeScope.Var('ca_knights_filled').GetValue|0]\nPlaces still empty: [ROOT.Char.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "Court tools"
 ca_court_panel_tooltip:0 "Court automation, appointments and knights"
 ca_automation_column_position:0 "Court position"
 ca_automation_column_mode:0 "Automation"
 ca_automation_column_status_tt:0 "Matches your selected mode"
 rule_ca_ai_support:0 "Court Automation: AI assistance"
 setting_ca_ai_conservative:0 "Conservative assistance"
 setting_ca_ai_conservative_desc:0 "Once a year, solvent AI rulers may receive up to two missing knights and one affordable court candidate when none exists. Current income and reserves for wages are checked; normal AI decides appointments."
 setting_ca_ai_disabled:0 "Disabled"
 setting_ca_ai_disabled_desc:0 "AI rulers receive no generated characters from Court Automation."
 ca_court_salary_summary_gold:0 "#bold Monthly salaries#! (paid tasks excluded)\nNow: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nAfter filling — estimate: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nEstimated increase: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Based on current rates. Appointment-specific salary terms can change the result.#!"
 ca_court_salary_summary_treasury:0 "#bold Monthly salaries#! (paid tasks excluded)\nNow: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nAfter filling — estimate: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nEstimated increase: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Based on current rates. Appointment-specific salary terms can change the result.#!"

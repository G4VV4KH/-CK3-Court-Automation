l_german:
 ca_court_automation:0 "Court Automation"
 ca_automation_title:0 "Hofautomatisierung"
 ca_automation_intro:0 "Wählt eine Regel für alle Hofämter. Sie greift, sobald ein Amt frei wird."
 ca_automation_result_help:0 "Die Liste zeigt die tatsächliche Einstellung jedes Amts. Ein Häkchen markiert Einstellungen, die Eurer Auswahl entsprechen."
 ca_automation_mode_none:0 "Keine Automatisierung"
 ca_automation_mode_none_tt:0 "Lasst freie Ämter unbesetzt, um sie selbst zu besetzen."
 ca_automation_mode_event:0 "Kandidaten vorschlagen"
 ca_automation_mode_event_tt:0 "Zeigt ein Ereignis mit Kandidatenvorschlägen an, sobald ein Amt frei wird."
 ca_automation_mode_best:0 "Besten ernennen"
 ca_automation_mode_best_tt:0 "Ernennt automatisch den zulässigen Kandidaten mit der höchsten Eignung."
 ca_automation_mode_best_event:0 "Ernennen oder melden"
 ca_automation_mode_best_event_tt:0 "Ernennt den besten zulässigen Kandidaten oder zeigt ein Ereignis an, wenn keiner verfügbar ist."
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "Schließen"
 decision_group_type_ca_court_automation:0 "Hofautomatisierung"
 ca_automation_decision:0 "Hofautomatisierung"
 ca_automation_decision_desc:0 "Legt eine einheitliche Regel für freie Hofämter fest. Wählt, ob Ämter unbesetzt bleiben, Kandidaten vorgeschlagen, die besten Kandidaten ernannt oder die besten Kandidaten ernannt und bei fehlenden Kandidaten Ereignisse angezeigt werden sollen."
 ca_automation_decision_tooltip:0 "Wählt eine Automatisierungsregel für alle Hofämter"
 ca_automation_decision_confirm:0 "Einstellungen öffnen"
 ca_automation_decision_effect:0 "Öffnet die Einstellungen zur Hofautomatisierung. Sie regeln den Umgang mit künftigen freien Ämtern. Nutzt #V Hof besetzen#!, um derzeit freie Ämter zu besetzen."
 ca_court_init_decision:0 "Hof besetzen"
 ca_court_init_decision_desc:0 "Bringt Euren Hof in Ordnung. Jedes verfügbare freie Amt erhält den zulässigen Kandidaten mit der höchsten Eignung. Fehlt ein Kandidat, wird ein neuer Höfling mit zufälligen Fähigkeiten erstellt, der die Anforderungen des Amts erfüllt.\n\nBestehende Amtsträger behalten ihre Ämter. Neue Amtsträger erhalten die üblichen Saläre.\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "Besetzt verfügbare Hofämter und erstellt bei Bedarf geeignete Höflinge"
 ca_court_init_decision_confirm:0 "Hof besetzen"
 ca_court_init_vacancy_required:0 "Mindestens ein unterstütztes Hofamt ist unbesetzt"
 ca_court_init_decision_effect:0 "Besetzt verfügbare Hofämter mit den besten zulässigen Kandidaten. Erstellt bei Bedarf zufällige Höflinge, die die Anforderungen erfüllen. Ersetzt weder bestehende Amtsträger noch Ratsmitglieder. Die üblichen Saläre fallen an."
 ca_court_init_result_title:0 "Hofämter besetzt"
 ca_court_init_result_desc:0 "Besetzte Ämter: [ca_result_recipient.MakeScope.Var('ca_court_init_filled').GetValue|0]\nNeue Höflinge: [ca_result_recipient.MakeScope.Var('ca_court_init_generated').GetValue|0]\nNoch freie Ämter: [ca_result_recipient.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "Ritter ergänzen"
 ca_bare_knights_decision_desc:0 "Füllt freie Plätze unter Euren Rittern mit Neuankömmlingen. Ihre Fähigkeiten und Persönlichkeiten sind zufällig: Manche mögen fähige Kämpfer sein, andere ausgesprochen schwach. Sie erfüllen die Anforderungen Eures Reichs, doch Heldentum ist nicht garantiert.\n\nErstellt nur so viele Charaktere, wie zum Erreichen Eurer derzeitigen Rittergrenze fehlen."
 ca_bare_knights_decision_tooltip:0 "Erstellt zufällige zulässige Ritter, um die freien Plätze zu füllen"
 ca_bare_knights_decision_confirm:0 "Neuankömmlinge aufnehmen"
 ca_bare_knights_vacancy_required:0 "Es gibt weniger Ritter als die zulässige Höchstzahl"
 ca_bare_knights_decision_effect:0 "Erstellt für jeden fehlenden Ritter einen neuen Höfling und erzwingt dessen Einsatz als Ritter. Die Fähigkeiten sind zufällig; garantiert werden nur die zwingenden Voraussetzungen. Keine Anwerbekosten."
 ca_bare_knights_result_title:0 "Neue Ritter am Hof"
 ca_bare_knights_result_desc:0 "Hinzugefügte Ritter: [ca_result_recipient.MakeScope.Var('ca_knights_filled').GetValue|0]\nNoch freie Plätze: [ca_result_recipient.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "Hofverwaltung"
 ca_court_panel_tooltip:0 "Hofautomatisierung, Ernennungen und Ritter"
 ca_automation_column_position:0 "Hofamt"
 ca_automation_column_mode:0 "Automatisierung"
 ca_automation_column_status_tt:0 "Entspricht dem gewählten Modus"
 rule_ca_ai_support:0 "Court Automation: KI-Unterstützung"
 setting_ca_ai_conservative:0 "Behutsame Unterstützung"
 setting_ca_ai_conservative_desc:0 "Einmal im Jahr können zahlungsfähige KI-Herrscher bis zu zwei fehlende Ritter erhalten. Fehlt ein geeigneter Kandidat für ein Hofamt, kann zusätzlich ein bezahlbarer Kandidat erstellt werden. Einkommen und Reserven für Saläre werden geprüft; über Ernennungen entscheidet die gewöhnliche KI."
 setting_ca_ai_disabled:0 "Deaktiviert"
 setting_ca_ai_disabled_desc:0 "Court Automation erstellt keine Charaktere für KI-Herrscher."
 ca_court_salary_summary_gold:0 "#bold Monatliche Saläre#! (ohne Kosten für Aufgaben)\nDerzeit: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nNach Besetzung – geschätzt: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nGeschätzte Mehrkosten: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Auf Grundlage der aktuellen Saläre. Besondere Salärvereinbarungen einzelner Amtsträger können das Ergebnis ändern.#!"
 ca_court_salary_summary_treasury:0 "#bold Monatliche Saläre#! (ohne Kosten für Aufgaben)\nDerzeit: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nNach Besetzung – geschätzt: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nGeschätzte Mehrkosten: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Auf Grundlage der aktuellen Saläre. Besondere Salärvereinbarungen einzelner Amtsträger können das Ergebnis ändern.#!"

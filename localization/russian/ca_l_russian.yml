l_russian:
 ca_court_automation:0 "Court Automation"
 ca_automation_title:0 "Автоматизация двора"
 ca_automation_intro:0 "Выберите общий режим для всех придворных должностей. Он применяется при освобождении места."
 ca_automation_result_help:0 "В списке показан текущий режим каждой должности. Галочка означает совпадение с вашим выбором."
 ca_automation_mode_none:0 "Без автоматизации"
 ca_automation_mode_none_tt:0 "Оставлять вакансии для ручного назначения."
 ca_automation_mode_event:0 "Предлагать кандидатов"
 ca_automation_mode_event_tt:0 "При освобождении должности показывать событие с подходящими кандидатами."
 ca_automation_mode_best:0 "Назначать лучшего"
 ca_automation_mode_best_tt:0 "Назначать подходящего кандидата с наибольшей пригодностью."
 ca_automation_mode_best_event:0 "Назначать или сообщать"
 ca_automation_mode_best_event_tt:0 "Назначать лучшего кандидата, а при его отсутствии показывать событие."
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "Закрыть"
 decision_group_type_ca_court_automation:0 "Управление двором"
 ca_automation_decision:0 "Автоматизация двора"
 ca_automation_decision_desc:0 "Установить общий порядок замещения придворных должностей: оставлять их свободными, предлагать кандидатов, назначать лучшего или назначать лучшего с уведомлением, если кандидатов нет."
 ca_automation_decision_tooltip:0 "Выбрать режим автоназначения для всех придворных должностей"
 ca_automation_decision_confirm:0 "Открыть настройки"
 ca_automation_decision_effect:0 "Открывает выбор общего режима автоназначения. Он определяет замещение будущих вакансий. Чтобы заполнить свободные места сейчас, используйте решение #V Обустроить двор#!."
 ca_court_init_decision:0 "Обустроить двор"
 ca_court_init_decision_desc:0 "Пора привести двор в порядок. Каждую доступную вакансию займёт подходящий кандидат с наилучшей пригодностью. Если такого кандидата нет, ко двору прибудет новый персонаж со случайными характеристиками, отвечающий требованиям должности.\n\nУже назначенные придворные сохранят свои места. Новые служащие будут получать обычное жалованье.\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "Заполнить придворные должности и при необходимости создать подходящих придворных"
 ca_court_init_decision_confirm:0 "Заполнить должности"
 ca_court_init_vacancy_required:0 "Есть хотя бы одна свободная поддерживаемая придворная должность"
 ca_court_init_decision_effect:0 "Заполняет доступные придворные должности лучшими подходящими кандидатами. При необходимости создаёт случайных персонажей, отвечающих требованиям. Сохраняет действующих служащих и советников. Выплачивается обычное жалованье."
 ca_court_init_result_title:0 "Назначения при дворе завершены"
 ca_court_init_result_desc:0 "Заполнено мест: [ROOT.Char.MakeScope.Var('ca_court_init_filled').GetValue|0]\nНовых придворных: [ROOT.Char.MakeScope.Var('ca_court_init_generated').GetValue|0]\nОсталось вакансий: [ROOT.Char.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "Рыцари с нуля"
 ca_bare_knights_decision_desc:0 "Заполнить свободные места в рыцарском строю новичками. Их способности и характер случайны: могут прийти умелые бойцы, а могут и весьма посредственные. Требованиям державы они соответствуют, но талант не обещан.\n\nПрибудет ровно столько персонажей, сколько не хватает до текущего предела рыцарей."
 ca_bare_knights_decision_tooltip:0 "Создать недостающих рыцарей со случайными характеристиками"
 ca_bare_knights_decision_confirm:0 "Принять новичков"
 ca_bare_knights_vacancy_required:0 "Число рыцарей меньше доступного предела"
 ca_bare_knights_decision_effect:0 "На каждое свободное место создаёт придворного и обязывает его служить рыцарем. Характеристики случайны; гарантировано лишь соблюдение обязательных требований. Без платы за найм."
 ca_bare_knights_result_title:0 "Новые рыцари при дворе"
 ca_bare_knights_result_desc:0 "Добавлено рыцарей: [ROOT.Char.MakeScope.Var('ca_knights_filled').GetValue|0]\nОсталось свободных мест: [ROOT.Char.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "Управление двором"
 ca_court_panel_tooltip:0 "Автоназначения, придворные и рыцари"
 ca_automation_column_position:0 "Должность"
 ca_automation_column_mode:0 "Автоназначение"
 ca_automation_column_status_tt:0 "Совпадает с выбранным режимом"
 rule_ca_ai_support:0 "Court Automation: помощь ИИ"
 setting_ca_ai_conservative:0 "Осторожная помощь"
 setting_ca_ai_conservative_desc:0 "Раз в год обеспеченный правитель ИИ может получить до двух недостающих рыцарей и одного кандидата на должность, если подходящих людей нет. Учитываются текущий доход и запас ресурсов на жалованье; назначения делает обычный ИИ."
 setting_ca_ai_disabled:0 "Отключено"
 setting_ca_ai_disabled_desc:0 "Court Automation не создаёт персонажей для правителей ИИ."
 ca_court_salary_summary_gold:0 "#bold Жалованье в месяц#! (без расходов на поручения)\nСейчас: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nПосле заполнения — оценка: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nОжидаемое увеличение: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Расчёт по текущим ставкам. Условия жалованья назначенных персонажей могут изменить итог.#!"
 ca_court_salary_summary_treasury:0 "#bold Жалованье в месяц#! (без расходов на поручения)\nСейчас: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nПосле заполнения — оценка: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nОжидаемое увеличение: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Расчёт по текущим ставкам. Условия жалованья назначенных персонажей могут изменить итог.#!"

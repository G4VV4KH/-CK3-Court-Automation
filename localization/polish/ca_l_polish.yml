l_polish:
 ca_court_automation:0 "Court Automation"
 ca_automation_title:0 "Automatyzacja dworu"
 ca_automation_intro:0 "Wybierz jedną zasadę dla wszystkich urzędów dworskich. Będzie stosowana, gdy urząd się zwolni."
 ca_automation_result_help:0 "Lista pokazuje faktyczne ustawienie każdego urzędu. Znacznik wskazuje ustawienia zgodne z twoim wyborem."
 ca_automation_mode_none:0 "Brak automatyzacji"
 ca_automation_mode_none_tt:0 "Pozostaw wolne urzędy do samodzielnego obsadzenia."
 ca_automation_mode_event:0 "Sugeruj kandydatów"
 ca_automation_mode_event_tt:0 "Wyświetl wydarzenie z propozycjami kandydatów, gdy urząd się zwolni."
 ca_automation_mode_best:0 "Wyznacz najlepszego"
 ca_automation_mode_best_tt:0 "Automatycznie wyznacz kandydata, który spełnia wymagania i ma najwyższe kompetencje."
 ca_automation_mode_best_event:0 "Wyznacz lub powiadom"
 ca_automation_mode_best_event_tt:0 "Wyznacz najlepszego kandydata spełniającego wymagania lub wyświetl wydarzenie, jeśli żaden nie jest dostępny."
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "Zamknij"
 decision_group_type_ca_court_automation:0 "Automatyzacja dworu"
 ca_automation_decision:0 "Automatyzacja dworu"
 ca_automation_decision_desc:0 "Ustal jedną zasadę postępowania z wolnymi urzędami dworskimi. Możesz pozostawiać je nieobsadzone, otrzymywać propozycje kandydatów, wyznaczać najlepszych lub wyznaczać najlepszych i otrzymywać powiadomienie, gdy nie ma kandydatów."
 ca_automation_decision_tooltip:0 "Wybierz zasadę automatyzacji dla wszystkich urzędów dworskich"
 ca_automation_decision_confirm:0 "Otwórz ustawienia"
 ca_automation_decision_effect:0 "Otwiera ustawienia automatyzacji dworu. Określają one sposób postępowania z urzędami, które zwolnią się w przyszłości. Użyj decyzji #V Obsadź dwór#!, aby obsadzić obecnie wolne urzędy."
 ca_court_init_decision:0 "Obsadź dwór"
 ca_court_init_decision_desc:0 "Uporządkuj swój dwór. Każdy dostępny wolny urząd otrzyma kandydat o najwyższych kompetencjach spośród osób spełniających wymagania. Jeśli nie ma kandydata, powstanie nowy dworzanin o losowych umiejętnościach, spełniający wymagania danego urzędu.\n\nObecni urzędnicy zachowają swoje stanowiska. Nowi urzędnicy będą pobierać zwykłe wynagrodzenie.\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "Obsadź dostępne urzędy dworskie, tworząc w razie potrzeby odpowiednich dworzan"
 ca_court_init_decision_confirm:0 "Obsadź urzędy"
 ca_court_init_vacancy_required:0 "Co najmniej jeden obsługiwany urząd dworski jest nieobsadzony"
 ca_court_init_decision_effect:0 "Obsadza dostępne urzędy dworskie najlepszymi kandydatami spełniającymi wymagania. W razie potrzeby tworzy losowych dworzan o wymaganych kwalifikacjach. Nie zastępuje obecnych urzędników ani członków rady. Obowiązują zwykłe wynagrodzenia."
 ca_court_init_result_title:0 "Obsadzono urzędy dworskie"
 ca_court_init_result_desc:0 "Obsadzone urzędy: [ca_result_recipient.MakeScope.Var('ca_court_init_filled').GetValue|0]\nNowi dworzanie: [ca_result_recipient.MakeScope.Var('ca_court_init_generated').GetValue|0]\nNieobsadzone urzędy: [ca_result_recipient.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "Nowi rycerze"
 ca_bare_knights_decision_desc:0 "Uzupełnij wolne miejsca wśród swoich rycerzy nowymi przybyszami. Ich umiejętności i osobowości są losowe: niektórzy mogą być zdolnymi wojownikami, inni bardzo słabymi. Spełniają wymagania twojego państwa, lecz wybitnych zdolności nikt nie obiecuje.\n\nTworzy tylko tylu rycerzy, ilu brakuje do obecnego limitu."
 ca_bare_knights_decision_tooltip:0 "Stwórz losowych rycerzy spełniających wymagania, aby zapełnić wolne miejsca"
 ca_bare_knights_decision_confirm:0 "Przyjmij przybyszów"
 ca_bare_knights_vacancy_required:0 "Liczba rycerzy jest niższa od limitu"
 ca_bare_knights_decision_effect:0 "Tworzy jednego nowego dworzanina za każdego brakującego rycerza i wymusza jego służbę jako rycerza. Umiejętności są losowe; gwarantowane jest tylko spełnienie niezbędnych wymagań. Bez opłaty za werbunek."
 ca_bare_knights_result_title:0 "Nowi rycerze na dworze"
 ca_bare_knights_result_desc:0 "Dodani rycerze: [ca_result_recipient.MakeScope.Var('ca_knights_filled').GetValue|0]\nPozostałe wolne miejsca: [ca_result_recipient.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "Zarządzanie dworem"
 ca_court_panel_tooltip:0 "Automatyzacja dworu, nominacje i rycerze"
 ca_automation_column_position:0 "Urząd dworski"
 ca_automation_column_mode:0 "Automatyzacja"
 ca_automation_column_status_tt:0 "Odpowiada wybranemu trybowi"
 rule_ca_ai_support:0 "Court Automation: pomoc SI"
 setting_ca_ai_conservative:0 "Ostrożna pomoc"
 setting_ca_ai_conservative_desc:0 "Raz w roku wypłacalni władcy SI mogą otrzymać do dwóch brakujących rycerzy. Jeśli nie ma odpowiedniego kandydata na urząd dworski, mogą też otrzymać jednego, o ile stać ich na jego wynagrodzenie. Sprawdzane są bieżące dochody i rezerwy na wynagrodzenia; o nominacjach decyduje standardowa SI."
 setting_ca_ai_disabled:0 "Wyłączona"
 setting_ca_ai_disabled_desc:0 "Court Automation nie tworzy postaci dla władców SI."
 ca_court_salary_summary_gold:0 "#bold Miesięczne wynagrodzenia#! (bez kosztów płatnych zadań)\nObecnie: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nPo obsadzeniu – szacunkowo: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nSzacowany wzrost: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Na podstawie obecnych stawek. Indywidualne warunki wynagrodzenia mogą zmienić wynik.#!"
 ca_court_salary_summary_treasury:0 "#bold Miesięczne wynagrodzenia#! (bez kosztów płatnych zadań)\nObecnie: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nPo obsadzeniu – szacunkowo: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nSzacowany wzrost: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Na podstawie obecnych stawek. Indywidualne warunki wynagrodzenia mogą zmienić wynik.#!"

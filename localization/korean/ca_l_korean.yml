l_korean:
 ca_court_automation:0 "궁정 자동화"
 ca_automation_title:0 "궁정 자동화"
 ca_automation_intro:0 "모든 궁정 직위에 적용할 방침을 선택합니다. 직위가 공석이 되면 적용됩니다."
 ca_automation_result_help:0 "목록에는 각 직위의 현재 설정이 표시됩니다. 선택한 방침과 일치하는 설정에는 확인 표시가 붙습니다."
 ca_automation_mode_none:0 "자동화 없음"
 ca_automation_mode_none_tt:0 "공석을 그대로 두고 직접 임명합니다."
 ca_automation_mode_event:0 "후보 추천"
 ca_automation_mode_event_tt:0 "직위가 공석이 되면 후보를 추천하는 이벤트를 표시합니다."
 ca_automation_mode_best:0 "최적 후보 임명"
 ca_automation_mode_best_tt:0 "자격을 갖춘 후보 중 적성이 가장 높은 인물을 자동으로 임명합니다."
 ca_automation_mode_best_event:0 "임명 또는 알림"
 ca_automation_mode_best_event_tt:0 "자격을 갖춘 최적의 후보를 임명하고, 후보가 없으면 이벤트로 알립니다."
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "닫기"
 decision_group_type_ca_court_automation:0 "궁정 자동화"
 ca_automation_decision:0 "궁정 자동화"
 ca_automation_decision_desc:0 "궁정 직위가 공석이 되었을 때의 처리 방침을 일괄 설정합니다. 공석으로 남기기, 후보 추천, 최적 후보 임명, 최적 후보를 임명하되 후보가 없으면 알림 중에서 선택할 수 있습니다."
 ca_automation_decision_tooltip:0 "모든 궁정 직위에 적용할 자동 임명 방침 선택"
 ca_automation_decision_confirm:0 "자동화 설정 열기"
 ca_automation_decision_effect:0 "궁정 자동화 설정을 열어 앞으로 생기는 공석의 처리 방침을 변경합니다. 현재 공석을 채우려면 #V 궁정 정비#!를 실행하십시오."
 ca_court_init_decision:0 "궁정 정비"
 ca_court_init_decision_desc:0 "궁정의 인원을 정비합니다. 임명 가능한 각 공석에 자격을 갖춘 후보 중 가장 적합한 인물을 임명합니다. 후보가 없으면 해당 직위의 자격을 갖추고 능력치는 무작위인 새 궁정 신하를 생성합니다.\n\n기존 직위 보유자는 직위를 유지합니다. 새로 임명된 인물에게는 정상적인 봉급을 지급합니다.\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "궁정 직위의 공석을 채우고 필요하면 자격을 갖춘 궁정 신하 생성"
 ca_court_init_decision_confirm:0 "공석 채우기"
 ca_court_init_vacancy_required:0 "지원하는 궁정 직위에 공석이 하나 이상 있음"
 ca_court_init_decision_effect:0 "임명 가능한 궁정 직위에 자격을 갖춘 최적의 후보를 임명합니다. 필요하면 자격을 갖춘 무작위 궁정 신하를 생성합니다. 기존 직위 보유자나 자문위원은 교체하지 않습니다. 정상적인 봉급이 적용됩니다."
 ca_court_init_result_title:0 "궁정 임명 완료"
 ca_court_init_result_desc:0 "채운 직위: [ROOT.Char.MakeScope.Var('ca_court_init_filled').GetValue|0]\n새 궁정 신하: [ROOT.Char.MakeScope.Var('ca_court_init_generated').GetValue|0]\n남은 공석: [ROOT.Char.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "기사 충원"
 ca_bare_knights_decision_desc:0 "기사 명단의 빈자리를 새 인물로 채웁니다. 능력치와 성격은 무작위입니다. 유능한 전사가 올 수도 있지만, 형편없는 인물이 올 수도 있습니다. 봉역의 자격 요건은 충족하지만 뛰어난 실력까지 보장하지는 않습니다.\n\n현재 기사 상한에 도달하는 데 필요한 인원만 생성합니다."
 ca_bare_knights_decision_tooltip:0 "자격을 갖춘 무작위 기사를 생성하여 부족한 인원 충원"
 ca_bare_knights_decision_confirm:0 "새 인물 맞이하기"
 ca_bare_knights_vacancy_required:0 "기사 수가 상한보다 적음"
 ca_bare_knights_decision_effect:0 "부족한 기사 한 명당 새 궁정 신하 한 명을 생성하고 기사 복무를 강제합니다. 능력치는 무작위이며 필수 자격 요건만 보장됩니다. 모집 비용은 없습니다."
 ca_bare_knights_result_title:0 "궁정에 도착한 새 기사"
 ca_bare_knights_result_desc:0 "추가된 기사: [ROOT.Char.MakeScope.Var('ca_knights_filled').GetValue|0]\n남은 빈자리: [ROOT.Char.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "궁정 관리"
 ca_court_panel_tooltip:0 "궁정 자동화, 임명 및 기사 충원"
 ca_automation_column_position:0 "궁정 직위"
 ca_automation_column_mode:0 "자동화"
 ca_automation_column_status_tt:0 "선택한 방침과 일치함"
 rule_ca_ai_support:0 "Court Automation: AI 지원"
 setting_ca_ai_conservative:0 "신중한 지원"
 setting_ca_ai_conservative_desc:0 "재정에 여유가 있는 AI 영주는 해마다 한 번 부족한 기사를 최대 두 명, 적합한 인물이 없는 궁정 직위의 후보를 최대 한 명 받을 수 있습니다. 후보는 봉급을 감당할 수 있을 때만 추가됩니다. 현재 수입과 봉급 지급을 위한 비축 자원을 확인하며, 임명 여부는 기존 AI가 결정합니다."
 setting_ca_ai_disabled:0 "비활성화"
 setting_ca_ai_disabled_desc:0 "Court Automation이 AI 영주를 위한 인물을 생성하지 않습니다."
 ca_court_salary_summary_gold:0 "#bold 월간 봉급#! (임무 추가 비용 제외)\n현재: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\n충원 후 예상: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\n예상 증가액: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak 현재 봉급 기준의 예상치입니다. 개별 임명의 봉급 조건에 따라 실제 금액이 달라질 수 있습니다.#!"
 ca_court_salary_summary_treasury:0 "#bold 월간 봉급#! (임무 추가 비용 제외)\n현재: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\n충원 후 예상: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\n예상 증가액: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak 현재 봉급 기준의 예상치입니다. 개별 임명의 봉급 조건에 따라 실제 금액이 달라질 수 있습니다.#!"

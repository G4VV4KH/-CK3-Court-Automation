l_french:
 ca_court_automation:0 "Court Automation"
 ca_automation_title:0 "Automatisation de la Cour"
 ca_automation_intro:0 "Choisissez un mode commun à tous les postes de la Cour. Il s’applique lorsqu’un poste devient vacant."
 ca_automation_result_help:0 "La liste affiche le mode actuel de chaque poste. Une coche indique qu’il correspond à votre choix."
 ca_automation_mode_none:0 "Sans automatisation"
 ca_automation_mode_none_tt:0 "Laisser les postes vacants pour que vous les pourvoyiez vous-même."
 ca_automation_mode_event:0 "Suggérer des candidats"
 ca_automation_mode_event_tt:0 "Afficher un événement proposant des candidats lorsqu’un poste devient vacant."
 ca_automation_mode_best:0 "Nommer le meilleur"
 ca_automation_mode_best_tt:0 "Nommer automatiquement le candidat éligible ayant la meilleure compétence pour le poste."
 ca_automation_mode_best_event:0 "Nommer ou avertir"
 ca_automation_mode_best_event_tt:0 "Nommer le meilleur candidat éligible, ou afficher un événement si aucun n’est disponible."
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "Fermer"
 decision_group_type_ca_court_automation:0 "Gestion de la Cour"
 ca_automation_decision:0 "Automatisation de la Cour"
 ca_automation_decision_desc:0 "Définir un mode commun pour les postes vacants de la Cour : les laisser libres, suggérer des candidats, nommer le meilleur candidat, ou le nommer et vous avertir si aucun candidat n’est disponible."
 ca_automation_decision_tooltip:0 "Choisir un mode d’automatisation pour tous les postes de la Cour"
 ca_automation_decision_confirm:0 "Ouvrir les paramètres"
 ca_automation_decision_effect:0 "Ouvre le choix du mode d’automatisation de la Cour. Ce mode s’applique aux postes qui se libéreront. Pour pourvoir les postes déjà vacants, utilisez #V Organiser la Cour#!."
 ca_court_init_decision:0 "Organiser la Cour"
 ca_court_init_decision_desc:0 "Mettre de l’ordre à la Cour. Chaque poste vacant disponible est proposé au candidat éligible ayant la meilleure compétence pour ce poste. Si aucun candidat n’est disponible, un nouveau courtisan est créé avec des aptitudes aléatoires et les qualifications requises pour le poste.\n\nLes titulaires actuels conservent leurs postes. Les nouveaux titulaires reçoivent leur salaire habituel.\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "Pourvoir les postes de la Cour disponibles et créer des courtisans qualifiés si nécessaire"
 ca_court_init_decision_confirm:0 "Pourvoir les postes"
 ca_court_init_vacancy_required:0 "Au moins un poste de la Cour pris en charge est vacant"
 ca_court_init_decision_effect:0 "Pourvoit les postes de la Cour disponibles avec les meilleurs candidats éligibles. Crée des courtisans aléatoires remplissant les conditions requises si nécessaire. Ne remplace ni les titulaires actuels ni les conseillers. Les salaires habituels s’appliquent."
 ca_court_init_result_title:0 "Nominations à la Cour terminées"
 ca_court_init_result_desc:0 "Postes pourvus : [ca_result_recipient.MakeScope.Var('ca_court_init_filled').GetValue|0]\nNouveaux courtisans : [ca_result_recipient.MakeScope.Var('ca_court_init_generated').GetValue|0]\nPostes encore vacants : [ca_result_recipient.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "De nouveaux chevaliers"
 ca_bare_knights_decision_desc:0 "Compléter les rangs de vos chevaliers avec de nouvelles recrues. Leurs aptitudes et leur personnalité sont aléatoires : certains seront peut-être de bons combattants, d’autres nettement moins remarquables. Ils remplissent les conditions de votre pays, mais le talent n’est pas garanti.\n\nCrée uniquement le nombre nécessaire pour atteindre votre limite actuelle de chevaliers."
 ca_bare_knights_decision_tooltip:0 "Créer des chevaliers aléatoires remplissant les conditions requises pour compléter les rangs"
 ca_bare_knights_decision_confirm:0 "Accueillir les recrues"
 ca_bare_knights_vacancy_required:0 "Le nombre de chevaliers est inférieur à la limite"
 ca_bare_knights_decision_effect:0 "Crée un nouveau courtisan par chevalier manquant et l’oblige à servir comme chevalier. Ses aptitudes sont aléatoires ; seul le respect des conditions obligatoires est garanti. Sans frais de recrutement."
 ca_bare_knights_result_title:0 "De nouveaux chevaliers à la Cour"
 ca_bare_knights_result_desc:0 "Chevaliers ajoutés : [ca_result_recipient.MakeScope.Var('ca_knights_filled').GetValue|0]\nPlaces encore libres : [ca_result_recipient.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "Gestion de la Cour"
 ca_court_panel_tooltip:0 "Automatisation de la Cour, nominations et chevaliers"
 ca_automation_column_position:0 "Poste de la Cour"
 ca_automation_column_mode:0 "Automatisation"
 ca_automation_column_status_tt:0 "Correspond au mode sélectionné"
 rule_ca_ai_support:0 "Court Automation : aide à l’IA"
 setting_ca_ai_conservative:0 "Aide prudente"
 setting_ca_ai_conservative_desc:0 "Une fois par an, les dirigeants contrôlés par l’IA dont les finances le permettent peuvent recevoir jusqu’à deux chevaliers manquants et un candidat à un poste dont ils peuvent payer le salaire, si aucun candidat n’est disponible. Les revenus actuels et les réserves pour les salaires sont vérifiés ; l’IA du jeu décide des nominations."
 setting_ca_ai_disabled:0 "Désactivée"
 setting_ca_ai_disabled_desc:0 "Court Automation ne crée aucun personnage pour les dirigeants contrôlés par l’IA."
 ca_court_salary_summary_gold:0 "#bold Salaires mensuels de base#! (hors tâches rémunérées)\nActuellement : [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nAprès les nominations — estimation : [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nAugmentation estimée : [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Calcul selon les taux actuels. Les conditions salariales propres à chaque nomination peuvent modifier le résultat.#!"
 ca_court_salary_summary_treasury:0 "#bold Salaires mensuels de base#! (hors tâches rémunérées)\nActuellement : [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nAprès les nominations — estimation : [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nAugmentation estimée : [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Calcul selon les taux actuels. Les conditions salariales propres à chaque nomination peuvent modifier le résultat.#!"
 ca_court_fill_now:0 "Pourvoir la Cour"
 ca_court_fill_now_tt:0 "Pourvoit immédiatement les postes disponibles de la Cour avec les candidats éligibles ayant la meilleure aptitude. Crée des courtisans aléatoires remplissant les conditions requises uniquement en l’absence de candidat éligible. Les titulaires actuels et les conseillers conservent leurs postes. Les salaires habituels s’appliquent.\n\n[GetPlayer.Custom('ca_court_salary_summary')]"
 ca_auto_court_label:0 "Maintenir les postes pourvus"
 ca_auto_court_tt:0 "À l’activation, pourvoit les postes disponibles de la Cour une fois l’automatisation du jeu suspendue, même en pause, puis les vérifie une fois par jour de jeu. Cela comprend les postes nouvellement débloqués et ceux libérés par des renvois. Choisit les meilleurs candidats éligibles, conserve les titulaires actuels et les conseillers, et ne crée des courtisans aléatoires remplissant les conditions requises qu’en l’absence de candidat éligible.\n\nLes salaires habituels s’appliquent. Tant que cette option est active, les règles du jeu pour les postes vacants sont suspendues. Sa désactivation rétablit le réglage précédent de chaque poste, même s’ils étaient différents.\n\nCette option et les réglages sauvegardés sont conservés lorsque vous changez de personnage joueur.\n\n[GetPlayer.Custom('ca_court_salary_summary')]"
 ca_auto_knights_label:0 "Maintenir l’effectif de chevaliers"
 ca_auto_knights_tt:0 "L’activation supprime tous les filtres personnels des chevaliers : la prouesse minimale passe à 0, la Maison, la dynastie et le rang des vassaux ne limitent plus le service, et toutes les cases d’autorisation sont cochées. Ces commandes restent verrouillées tant que le maintien de l’effectif est actif.\n\nUne fois les filtres supprimés, l’automatisation complète l’effectif de chevaliers, même en pause, puis le vérifie une fois par jour de jeu. Crée des courtisans aléatoires répondant aux exigences obligatoires et les oblige à servir. Ils peuvent être médiocres ; les restrictions culturelles, religieuses et autres conditions obligatoires restent applicables. Le statut individuel de chevalier des personnages existants n’est pas modifié. Sans frais de recrutement.\n\nLa désactivation déverrouille les commandes mais laisse les filtres supprimés ; les anciens réglages ne sont pas rétablis. L’option d’automatisation est conservée lorsque vous changez de personnage joueur. Une erreur interrompt les nouvelles tentatives automatiques."
 ca_advanced_title:0 "Avancé : nominations"
 ca_native_policy_locked_tt:0 "Désactivez « $ca_auto_court_label$ » pour modifier les règles du jeu concernant les postes vacants. La désactivation rétablit le réglage précédent de chaque poste."
 ca_automation_paused_error_title:0 "Automatisation arrêtée"
 ca_automation_paused_error_desc:0 "Court Automation a arrêté cette fonction automatique après une erreur. L’autre option reste inchangée. Vérifiez votre Cour et réactivez l’option arrêtée pour réessayer."
 ca_auto_knights_result_title:0 "Nouveaux chevaliers"
 ca_auto_knights_result_desc:0 "Chevaliers ajoutés : [ca_result_recipient.MakeScope.Var('ca_knights_filled').GetValue|0]"
 ca_auto_knights_count:0 "Chevaliers : [GetPlayer.MakeScope.ScriptValue('ca_current_knight_count')|0] / [GetPlayer.MakeScope.ScriptValue('ca_max_knight_count')|0]"
 ca_knight_filters_locked:0 "Les filtres personnels des chevaliers sont supprimés et leurs commandes verrouillées tant que le maintien de l’effectif est actif. Désactivez-le pour les modifier ; les anciens filtres ne seront pas rétablis."
 ca_exclude_court_jester_label:0 "Exclure le bouffon de la Cour"
 ca_exclude_court_jester_tt:0 "Ignorer ce poste pour « Organiser la Cour », « Pourvoir la Cour », « Maintenir les postes pourvus » et les changements groupés des modes de nomination du jeu. Le titulaire actuel ne sera ni renvoyé ni remplacé. Les nominations manuelles et celles du jeu restent disponibles. Si le poste est exclu alors que « Maintenir les postes pourvus » est activé, son mode de nomination enregistré avant l’automatisation sera rétabli. Ce réglage sera transmis à votre successeur."

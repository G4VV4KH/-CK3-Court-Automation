l_japanese:
 ca_court_automation:0 "宮廷の自動化"
 ca_automation_title:0 "宮廷の自動化"
 ca_automation_intro:0 "すべての王宮役職に共通の方針を選択します。職に空きが出た際に適用されます。"
 ca_automation_result_help:0 "一覧には各職の現在の設定が表示されます。選択した方針と一致する設定にはチェックが付きます。"
 ca_automation_mode_none:0 "自動化なし"
 ca_automation_mode_none_tt:0 "空席のままにし、手動で任命します。"
 ca_automation_mode_event:0 "候補者を推薦"
 ca_automation_mode_event_tt:0 "職に空きが出た際に、候補者を推薦するイベントを表示します。"
 ca_automation_mode_best:0 "最適な候補者を任命"
 ca_automation_mode_best_tt:0 "条件を満たす候補者のうち、最も適性が高い人物を自動で任命します。"
 ca_automation_mode_best_event:0 "任命または通知"
 ca_automation_mode_best_event_tt:0 "条件を満たす最適な候補者を任命し、候補者がいない場合はイベントで通知します。"
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "閉じる"
 decision_group_type_ca_court_automation:0 "宮廷の自動化"
 ca_automation_decision:0 "宮廷の自動化"
 ca_automation_decision_desc:0 "王宮役職に空きが出た際の対応を一括設定します。空席のままにする、候補者を推薦する、最適な候補者を任命する、任命して候補者がいない場合は通知する、のいずれかを選べます。"
 ca_automation_decision_tooltip:0 "すべての王宮役職の自動任命方針を選択する"
 ca_automation_decision_confirm:0 "自動化設定を開く"
 ca_automation_decision_effect:0 "宮廷の自動化設定を開き、今後空席が生じた際の対応を変更します。現在の空席を埋めるには、#V 宮廷を整える#!を実行してください。"
 ca_court_init_decision:0 "宮廷を整える"
 ca_court_init_decision_desc:0 "宮廷の人員を整えます。任命可能な各空席に、条件を満たす最も適性の高い候補者を任命します。候補者がいない場合は、その職の条件を満たし、能力がランダムな新しい廷臣を作成します。\n\n現在の担当者は職を維持します。新たに任命された人物には通常の給与が支払われます。\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "王宮役職の空席を埋め、必要に応じて条件を満たす廷臣を作成する"
 ca_court_init_decision_confirm:0 "空席を埋める"
 ca_court_init_vacancy_required:0 "対応する王宮役職に少なくとも1つ空席がある"
 ca_court_init_decision_effect:0 "任命可能な王宮役職の空席に、条件を満たす最適な候補者を任命します。必要に応じて、条件を満たすランダムな廷臣を作成します。現在の担当者や評議員は交代させません。通常の給与が発生します。"
 ca_court_init_result_title:0 "宮廷の任命が完了"
 ca_court_init_result_desc:0 "埋めた空席：[ROOT.Char.MakeScope.Var('ca_court_init_filled').GetValue|0]\n新しい廷臣：[ROOT.Char.MakeScope.Var('ca_court_init_generated').GetValue|0]\n残りの空席：[ROOT.Char.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "騎士を補充"
 ca_bare_knights_decision_desc:0 "騎士の空きを新参者で埋めます。能力や性格はランダムです。優れた戦士が来ることもあれば、まるで頼りにならない者が来ることもあります。領国の条件は満たしますが、才能までは保証されません。\n\n現在の騎士の上限に達するまで、不足している人数だけを作成します。"
 ca_bare_knights_decision_tooltip:0 "条件を満たすランダムな騎士を作成し、不足を補う"
 ca_bare_knights_decision_confirm:0 "新参者を迎える"
 ca_bare_knights_vacancy_required:0 "騎士の人数が上限に達していない"
 ca_bare_knights_decision_effect:0 "不足している騎士1人につき新しい廷臣を1人作成し、騎士としての従軍を強制します。能力はランダムで、必須条件を満たすことのみ保証されます。雇用費用はかかりません。"
 ca_bare_knights_result_title:0 "新たな騎士が宮廷に到着"
 ca_bare_knights_result_desc:0 "追加された騎士：[ROOT.Char.MakeScope.Var('ca_knights_filled').GetValue|0]\n残りの空き：[ROOT.Char.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "宮廷管理"
 ca_court_panel_tooltip:0 "宮廷の自動化、任命、騎士の補充"
 ca_automation_column_position:0 "王宮役職"
 ca_automation_column_mode:0 "自動化"
 ca_automation_column_status_tt:0 "選択した方針と一致"
 rule_ca_ai_support:0 "Court Automation：AI支援"
 setting_ca_ai_conservative:0 "控えめな支援"
 setting_ca_ai_conservative_desc:0 "資金に余裕のあるAI統治者は、年に1度、不足する騎士を最大2人、適任者がいない王宮役職の候補者を最大1人受け取れます。候補者は給与を賄える場合のみ追加されます。現在の収支と給与用の蓄えを確認し、任命は通常のAIが判断します。"
 setting_ca_ai_disabled:0 "無効"
 setting_ca_ai_disabled_desc:0 "Court AutomationはAI統治者のために人物を作成しません。"
 ca_court_salary_summary_gold:0 "#bold 毎月の給与#!（任務の追加費用を除く）\n現在：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\n補充後の概算：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\n増加分の概算：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak 現在の給与水準に基づく概算です。任命時の個別の給与条件により、実際の金額は変わる場合があります。#!"
 ca_court_salary_summary_treasury:0 "#bold 毎月の給与#!（任務の追加費用を除く）\n現在：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\n補充後の概算：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\n増加分の概算：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak 現在の給与水準に基づく概算です。任命時の個別の給与条件により、実際の金額は変わる場合があります。#!"

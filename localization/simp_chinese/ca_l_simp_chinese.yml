l_simp_chinese:
 ca_court_automation:0 "宫廷自动化"
 ca_automation_title:0 "宫廷自动化"
 ca_automation_intro:0 "为所有宫廷职位选择统一的处理方式。职位出现空缺时生效。"
 ca_automation_result_help:0 "列表显示各职位的当前设置。与所选模式一致的设置会显示勾号。"
 ca_automation_mode_none:0 "不自动任命"
 ca_automation_mode_none_tt:0 "保留空缺，由你手动任命。"
 ca_automation_mode_event:0 "推荐候选人"
 ca_automation_mode_event_tt:0 "职位出现空缺时，弹出事件推荐候选人。"
 ca_automation_mode_best:0 "任命最佳人选"
 ca_automation_mode_best_tt:0 "自动任命符合条件且称职度最高的候选人。"
 ca_automation_mode_best_event:0 "任命或通知"
 ca_automation_mode_best_event_tt:0 "任命符合条件的最佳人选；若无人可用，则弹出事件通知。"
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "关闭"
 decision_group_type_ca_court_automation:0 "宫廷自动化"
 ca_automation_decision:0 "宫廷自动化"
 ca_automation_decision_desc:0 "为宫廷职位的空缺设置统一的处理方式。可选择保留空缺、推荐候选人、任命最佳人选，或任命最佳人选并在无人可用时通知。"
 ca_automation_decision_tooltip:0 "为所有宫廷职位选择自动任命模式"
 ca_automation_decision_confirm:0 "打开自动化设置"
 ca_automation_decision_effect:0 "打开宫廷自动化设置，调整今后职位出现空缺时的处理方式。要填补当前空缺，请使用#V 整顿宫廷#!。"
 ca_court_init_decision:0 "整顿宫廷"
 ca_court_init_decision_desc:0 "整顿宫廷的人事安排。为每个可任命的空缺职位选择符合条件且称职度最高的候选人。若无人可用，则生成一名能力随机、满足该职位任职条件的新廷臣。\n\n现任人员保留职位。新任人员领取正常俸禄。\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "填补宫廷职位空缺，必要时生成符合条件的廷臣"
 ca_court_init_decision_confirm:0 "填补空缺"
 ca_court_init_vacancy_required:0 "至少有一个受支持的宫廷职位存在空缺"
 ca_court_init_decision_effect:0 "为可任命的宫廷职位空缺选择符合条件的最佳人选。必要时生成符合任职条件的随机廷臣。不会替换现任人员或内阁成员。正常支付俸禄。"
 ca_court_init_result_title:0 "宫廷任命完成"
 ca_court_init_result_desc:0 "已填补职位：[ca_result_recipient.MakeScope.Var('ca_court_init_filled').GetValue|0]\n新增廷臣：[ca_result_recipient.MakeScope.Var('ca_court_init_generated').GetValue|0]\n剩余空缺：[ca_result_recipient.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "补充骑士"
 ca_bare_knights_decision_desc:0 "用新人补齐骑士名额。他们的能力和性格都是随机的：可能是出色的战士，也可能平庸得令人失望。他们符合领国的任职条件，但才能并无保证。\n\n只生成补足当前骑士上限所需的人数。"
 ca_bare_knights_decision_tooltip:0 "生成符合条件的随机骑士，补齐名额"
 ca_bare_knights_decision_confirm:0 "迎接新人"
 ca_bare_knights_vacancy_required:0 "当前骑士人数低于上限"
 ca_bare_knights_decision_effect:0 "每缺少一名骑士，就生成一名新廷臣并强制其担任骑士。能力随机，仅保证满足必要的任职条件。无需招募费用。"
 ca_bare_knights_result_title:0 "新骑士抵达宫廷"
 ca_bare_knights_result_desc:0 "新增骑士：[ca_result_recipient.MakeScope.Var('ca_knights_filled').GetValue|0]\n剩余名额：[ca_result_recipient.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "宫廷管理"
 ca_court_panel_tooltip:0 "宫廷自动化、任命与骑士补充"
 ca_automation_column_position:0 "宫廷职位"
 ca_automation_column_mode:0 "自动任命"
 ca_automation_column_status_tt:0 "与所选模式一致"
 rule_ca_ai_support:0 "Court Automation：AI辅助"
 setting_ca_ai_conservative:0 "审慎辅助"
 setting_ca_ai_conservative_desc:0 "每年一次，财力充足的AI统治者可获得最多两名缺少的骑士；若某个宫廷职位没有合适人选且负担得起俸禄，还可获得一名候选人。会检查当前收支及用于支付俸禄的储备；任命仍由游戏AI决定。"
 setting_ca_ai_disabled:0 "禁用"
 setting_ca_ai_disabled_desc:0 "Court Automation不会为AI统治者生成人物。"
 ca_court_salary_summary_gold:0 "#bold 每月俸禄#!（不含任务额外开支）\n当前：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\n填补后估算：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\n预计增加：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak 按当前标准估算。具体任命的俸禄条件可能改变实际金额。#!"
 ca_court_salary_summary_treasury:0 "#bold 每月俸禄#!（不含任务额外开支）\n当前：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\n填补后估算：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\n预计增加：[ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak 按当前标准估算。具体任命的俸禄条件可能改变实际金额。#!"

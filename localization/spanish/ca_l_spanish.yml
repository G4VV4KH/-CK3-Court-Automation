l_spanish:
 ca_court_automation:0 "Court Automation"
 ca_automation_title:0 "Automatización de la corte"
 ca_automation_intro:0 "Elige un mismo modo para todos los puestos en la corte. Se aplica cuando un puesto queda vacante."
 ca_automation_result_help:0 "La lista muestra el modo actual de cada puesto. Una marca indica que coincide con tu elección."
 ca_automation_mode_none:0 "Sin automatización"
 ca_automation_mode_none_tt:0 "Dejar los puestos vacantes para que los cubras manualmente."
 ca_automation_mode_event:0 "Sugerir candidatos"
 ca_automation_mode_event_tt:0 "Mostrar un evento con candidatos sugeridos cuando un puesto quede vacante."
 ca_automation_mode_best:0 "Nombrar al mejor"
 ca_automation_mode_best_tt:0 "Nombrar automáticamente al candidato elegible con mayor aptitud."
 ca_automation_mode_best_event:0 "Nombrar o avisar"
 ca_automation_mode_best_event_tt:0 "Nombrar al mejor candidato elegible o mostrar un evento si no hay ninguno disponible."
 ca_automation_applied:0 "@check_icon!"
 ca_automation_pending:0 "—"
 ca_automation_close:0 "Cerrar"
 decision_group_type_ca_court_automation:0 "Gestión de la corte"
 ca_automation_decision:0 "Automatización de la corte"
 ca_automation_decision_desc:0 "Establecer un mismo modo para cubrir las vacantes de la corte. Elige entre dejar los puestos vacíos, sugerir candidatos, nombrar al mejor candidato o nombrarlo y avisarte cuando no haya ninguno disponible."
 ca_automation_decision_tooltip:0 "Elegir un modo de automatización para todos los puestos en la corte"
 ca_automation_decision_confirm:0 "Abrir la configuración"
 ca_automation_decision_effect:0 "Abre el selector de automatización de la corte. Este modo determina cómo se cubrirán las futuras vacantes. Usa #V Organizar la corte#! para cubrir las vacantes actuales."
 ca_court_init_decision:0 "Organizar la corte"
 ca_court_init_decision_desc:0 "Poner orden en la corte. Cada vacante disponible se ofrece al candidato elegible con mayor aptitud. Si no hay ningún candidato disponible, se crea un nuevo cortesano con habilidades aleatorias que cumpla los requisitos del puesto.\n\nLos titulares actuales conservan sus puestos. Los nuevos titulares reciben sus salarios habituales.\n\n[ROOT.Char.Custom('ca_court_salary_summary')]"
 ca_court_init_decision_tooltip:0 "Cubrir los puestos disponibles en la corte y crear cortesanos aptos cuando haga falta"
 ca_court_init_decision_confirm:0 "Cubrir los puestos"
 ca_court_init_vacancy_required:0 "Hay una vacante en al menos un puesto en la corte compatible"
 ca_court_init_decision_effect:0 "Cubre los puestos disponibles en la corte con los mejores candidatos elegibles. Crea cortesanos aleatorios que cumplen los requisitos cuando hace falta. No reemplaza a los titulares actuales ni a los consejeros. Se pagan los salarios habituales."
 ca_court_init_result_title:0 "Nombramientos de la corte completados"
 ca_court_init_result_desc:0 "Puestos cubiertos: [ca_result_recipient.MakeScope.Var('ca_court_init_filled').GetValue|0]\nNuevos cortesanos: [ca_result_recipient.MakeScope.Var('ca_court_init_generated').GetValue|0]\nPuestos aún vacantes: [ca_result_recipient.MakeScope.Var('ca_court_init_unfilled').GetValue|0]"
 ca_bare_knights_decision:0 "Caballeros desde cero"
 ca_bare_knights_decision_desc:0 "Completar las filas de tus caballeros con nuevos reclutas. Sus habilidades y personalidades son aleatorias: algunos pueden ser buenos combatientes; otros, bastante mediocres. Cumplen los requisitos de tu señorío, pero el talento no está garantizado.\n\nSolo se crea el número necesario para alcanzar tu límite actual de caballeros."
 ca_bare_knights_decision_tooltip:0 "Crear caballeros aleatorios que cumplan los requisitos para completar las filas"
 ca_bare_knights_decision_confirm:0 "Recibir a los reclutas"
 ca_bare_knights_vacancy_required:0 "El número de caballeros es inferior al límite"
 ca_bare_knights_decision_effect:0 "Crea un nuevo cortesano por cada caballero que falte y lo obliga a servir como caballero. Sus habilidades son aleatorias; solo se garantiza que cumpla los requisitos obligatorios. Sin coste de reclutamiento."
 ca_bare_knights_result_title:0 "Nuevos caballeros en la corte"
 ca_bare_knights_result_desc:0 "Caballeros añadidos: [ca_result_recipient.MakeScope.Var('ca_knights_filled').GetValue|0]\nPlazas aún vacías: [ca_result_recipient.MakeScope.Var('ca_knights_remaining').GetValue|0]"
 ca_court_panel_title:0 "Gestión de la corte"
 ca_court_panel_tooltip:0 "Automatización de la corte, nombramientos y caballeros"
 ca_automation_column_position:0 "Puesto en la corte"
 ca_automation_column_mode:0 "Automatización"
 ca_automation_column_status_tt:0 "Coincide con el modo seleccionado"
 rule_ca_ai_support:0 "Court Automation: ayuda a la IA"
 setting_ca_ai_conservative:0 "Ayuda prudente"
 setting_ca_ai_conservative_desc:0 "Una vez al año, los gobernantes de la IA con recursos suficientes pueden recibir hasta dos caballeros que les falten y un candidato para un puesto cuyo salario puedan pagar, si no hay ningún candidato disponible. Se comprueban los ingresos actuales y las reservas para salarios; la IA del juego decide los nombramientos."
 setting_ca_ai_disabled:0 "Desactivada"
 setting_ca_ai_disabled_desc:0 "Court Automation no crea personajes para los gobernantes de la IA."
 ca_court_salary_summary_gold:0 "#bold Salarios mensuales básicos#! (sin tareas remuneradas)\nAhora: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nTras cubrir las vacantes — estimación: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nAumento estimado: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_gold')|2] @gold_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Cálculo según las tarifas actuales. Las condiciones salariales de cada nombramiento pueden cambiar el resultado.#!"
 ca_court_salary_summary_treasury:0 "#bold Salarios mensuales básicos#! (sin tareas remuneradas)\nAhora: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_current_prestige')|2] @prestige_icon!\nTras cubrir las vacantes — estimación: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_full_prestige')|2] @prestige_icon!\nAumento estimado: [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_treasury')|2] @treasury_icon!  [ROOT.Char.MakeScope.ScriptValue('ca_court_salary_additional_prestige')|2] @prestige_icon!\n#weak Cálculo según las tarifas actuales. Las condiciones salariales de cada nombramiento pueden cambiar el resultado.#!"
